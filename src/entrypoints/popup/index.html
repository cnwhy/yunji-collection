<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>云笈收藏助手</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="card yunji-card">
    <div class="yunji-header">
      <h3>云笈</h3>
      <a href="#" id="yunjiAddInstanceBtn" class="yunji-icon" title="添加新的云笈实例，不同地址的凭证分别保存">＋ 添加实例</a>
    </div>

    <!-- 实例卡片列表：每张卡片对应一个云笈站点 -->
    <div id="yunjiInstanceList" class="yunji-instance-list"></div>

    <!-- 添加实例表单 -->
    <div id="yunjiConfigForm" class="yunji-form" style="display: none;">
      <div class="yunji-form-title">添加云笈实例</div>
      <label class="yunji-label" for="yunjiBaseUrlInput">云笈地址</label>
      <input id="yunjiBaseUrlInput" type="text" placeholder="例如: https://nav.example.com" />
      <p class="yunji-hint">可直接打开云笈站点自动识别；地址相同的实例会切换到已有卡片。</p>
      <div class="yunji-actions">
        <button id="yunjiCancelBaseUrlBtn" class="btn-plain">取消</button>
        <button id="yunjiBindBtn" class="btn-yunji" style="display: none;">绑定云笈</button>
        <button id="yunjiSaveBaseUrlBtn" class="btn-yunji">保存地址</button>
      </div>
    </div>

    <!-- 空间登录表单（作用于最近一次操作的卡片） -->
    <div id="yunjiSpaceForm" class="yunji-form" style="display: none;">
      <div id="yunjiSpaceFormTitle" class="yunji-form-title">添加空间</div>
      <label class="yunji-label" for="yunjiUsername">空间ID</label>
      <input id="yunjiUsername" type="text" autocomplete="username" />
      <label class="yunji-label" for="yunjiPassword">密码</label>
      <input id="yunjiPassword" type="password" autocomplete="current-password" />
      <p class="yunji-hint">密码只用于换取登录凭证，不会保存在插件里。</p>
      <div class="yunji-actions">
        <button id="yunjiSpaceCancelBtn" class="btn-plain">取消</button>
        <button id="yunjiSpaceSubmitBtn" class="btn-yunji">登录并保存</button>
      </div>
    </div>

    <!-- 自定义收藏表单 -->
    <div id="yunjiForm" class="yunji-form" style="display: none;">
      <div class="yunji-field">
        <label class="yunji-label" for="yunjiName">名称</label>
        <input id="yunjiName" type="text" maxlength="100" />
      </div>

      <div class="yunji-field">
        <label class="yunji-label" for="yunjiUrl">网址</label>
        <input id="yunjiUrl" type="text" placeholder="https://…" />
      </div>

      <div class="yunji-field">
        <label class="yunji-label" for="yunjiCategory">分类</label>
        <select id="yunjiCategory" aria-label="收藏分类"></select>
      </div>

      <div class="yunji-field">
        <label class="yunji-label" for="yunjiEnvironment">环境</label>
        <select id="yunjiEnvironment" aria-label="收藏环境"></select>
      </div>

      <p class="yunji-hint">默认「浏览器收藏」分类 + 第一个环境，可自行修改。</p>

      <div class="yunji-actions">
        <button id="yunjiCancelBtn" class="btn-plain">取消</button>
        <button id="yunjiSubmitBtn" class="btn-yunji">确认添加</button>
      </div>
    </div>

    <p id="yunjiMessage" class="yunji-message"></p>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
